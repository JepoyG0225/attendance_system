<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scanner</title>
  <link rel="icon" type="image/png" href="/static/app-icon.png" />
  <link href="/static/fonts/montserrat.css" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:  #00c853;
      --yellow: #ffd600;
      --red:    #ff1744;
      --blue:   #2979ff;
      --card-bg: rgba(255,255,255,0.06);
    }

    html, body {
      width: 100%; height: 100%; overflow: hidden;
      font-family: "Montserrat", "Segoe UI", Arial, sans-serif;
      background: #0a0e1a;
      color: #fff;
      user-select: none;
      /* Kiosk: hide the mouse cursor everywhere on the page */
      cursor: none;
    }
    *, *::before, *::after { cursor: none !important; }

    /* ── Header bar ─────────────────────────────────────────────────────── */
    /* Big top padding so the badge + clock clear the Pi case bezel on 7"
       displays (typically 12-25mm of physical bezel — generous default for
       worst-case cases). env(safe-area-inset-*) fallback if the OS reports one. */
    #header {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 125px 28px 14px 28px;
      padding-top: max(125px, env(safe-area-inset-top, 125px));
      background: rgba(10,14,26,0.85);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255,255,255,.08);
      z-index: 10;
    }
    #header-left { display: flex; align-items: center; }
    /* Scanner label rendered as a pill badge — replaces the previous
       small low-contrast text under the school name. */
    #scanner-label {
      display: inline-flex; align-items: center;
      font-size: .82rem; font-weight: 700; letter-spacing: .14em;
      text-transform: uppercase; color: #fff;
      background: rgba(41,121,255,.18);
      border: 1.5px solid rgba(41,121,255,.55);
      padding: 7px 16px;
      border-radius: 999px;
      box-shadow: 0 0 18px rgba(41,121,255,.18);
    }
    #header-right { text-align: right; }
    #clock-date { font-size: .78rem; color: rgba(255,255,255,.5); }
    #clock-time { font-size: 1.4rem; font-weight: 700; letter-spacing: .04em; color: #fff; }

    /* ── Main stage ─────────────────────────────────────────────────────── */
    /* padding-top accounts for the taller header above (~160px now). */
    #stage {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      padding-top: 190px;
      padding-bottom: 40px;
    }

    /* ── Idle screen ────────────────────────────────────────────────────── */
    #idle {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 32px;
      transition: opacity .4s;
    }

    /* Logo circle with ripple waves */
    .logo-circle-wrapper {
      position: relative;
      width: 240px; height: 240px;
      display: flex; align-items: center; justify-content: center;
    }
    .logo-wave {
      position: absolute; inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(41,121,255,.35);
      animation: ripple 2.6s ease-out infinite;
    }
    .logo-wave:nth-child(2) { animation-delay: .85s; }
    .logo-wave:nth-child(3) { animation-delay: 1.7s; }
    @keyframes ripple {
      0%   { transform: scale(.88); opacity: .9; }
      100% { transform: scale(1.75); opacity: 0; }
    }
    .logo-circle {
      position: relative; z-index: 1;
      width: 240px; height: 240px;
      border-radius: 50%;
      background: transparent;
      border: 3px solid rgba(255,255,255,.18);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      box-shadow: 0 0 60px rgba(41,121,255,.18), 0 0 120px rgba(41,121,255,.08);
    }
    .logo-circle img {
      /* `cover` fills the circle edge-to-edge so the round school crest
         visually matches the circular wave border. */
      width: 100%; height: 100%;
      object-fit: cover;
    }

    #idle-school {
      font-size: 1.25rem; font-weight: 700; letter-spacing: .04em;
      color: rgba(255,255,255,.85); text-align: center;
      text-transform: uppercase;
    }
    #idle-text {
      font-size: 1.2rem; font-weight: 300; letter-spacing: .1em;
      color: rgba(255,255,255,.5); text-transform: uppercase;
      margin-top: -12px;
    }
    #idle-sub {
      font-size: .82rem; color: rgba(255,255,255,.25); letter-spacing: .06em;
      margin-top: -18px;
    }

    /* ── Scan result card — square ──────────────────────────────────────── */
    #result {
      display: none;
      width: min(460px, 94vw);
      background: var(--card-bg);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 28px;
      backdrop-filter: blur(20px);
      overflow: hidden;
      animation: slideUp .35s cubic-bezier(.22,1,.36,1);
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px) scale(.96); }
      to   { opacity: 1; transform: translateY(0)    scale(1);   }
    }

    /* colour accent bar at top */
    #result-accent {
      height: 5px;
      background: var(--green);
      transition: background .3s;
    }
    #result-accent.late    { background: var(--yellow); }
    #result-accent.timeout { background: var(--blue); }
    #result-accent.error   { background: var(--red); }

    /* single column body */
    #result-body {
      display: flex; flex-direction: column; align-items: center;
      padding: 28px 28px 24px;
      gap: 0;
    }

    /* ── Photo ──────────────────────────────────────────────────────────── */
    #student-photo {
      width: 230px; height: 230px;
      border-radius: 18px;
      object-fit: cover;
      border: 3px solid rgba(255,255,255,.18);
      background: #1a2035;
      margin-bottom: 18px;
    }
    #student-initials {
      display: none;
      width: 230px; height: 230px;
      border-radius: 18px;
      background: linear-gradient(135deg,#1e3a8a,#2979ff);
      align-items: center; justify-content: center;
      font-size: 5rem; font-weight: 800; color: #fff;
      border: 3px solid rgba(255,255,255,.18);
      margin-bottom: 18px;
    }

    /* ── Name & grade ───────────────────────────────────────────────────── */
    #student-name {
      font-size: 1.9rem; font-weight: 800;
      line-height: 1.15; color: #fff;
      letter-spacing: -.01em;
      text-align: center;
      margin-bottom: 6px;
    }
    #student-grade-badge {
      font-size: .78rem; font-weight: 700; letter-spacing: .07em;
      text-transform: uppercase;
      background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.14);
      color: rgba(255,255,255,.75);
      padding: 4px 14px; border-radius: 20px;
      margin-bottom: 20px;
    }

    /* ── Divider ────────────────────────────────────────────────────────── */
    .card-divider {
      width: 100%; height: 1px;
      background: rgba(255,255,255,.08);
      margin-bottom: 18px;
    }

    /* ── Attendance info ────────────────────────────────────────────────── */
    #action-row {
      display: flex; align-items: center; justify-content: center;
      gap: 10px; flex-wrap: wrap;
      margin-bottom: 14px;
    }
    #action-badge {
      font-size: .82rem; font-weight: 800; letter-spacing: .1em;
      text-transform: uppercase; padding: 6px 18px; border-radius: 30px;
    }
    #action-badge.time-in  { background: rgba(0,200,83,.18);  color: var(--green);  border: 2px solid var(--green); }
    #action-badge.time-out { background: rgba(41,121,255,.18); color: var(--blue);   border: 2px solid var(--blue);  }
    #action-badge.error    { background: rgba(255,23,68,.18);  color: var(--red);    border: 2px solid var(--red);   }
    #status-badge {
      font-size: .78rem; font-weight: 700; letter-spacing: .07em;
      text-transform: uppercase; padding: 5px 14px; border-radius: 20px;
    }
    #status-badge.present { background: rgba(0,200,83,.12);  color: var(--green); }
    #status-badge.late    { background: rgba(255,214,0,.12);  color: var(--yellow);}
    #status-badge.timeout { background: rgba(41,121,255,.12); color: var(--blue);  }

    #time-display {
      font-size: 2.8rem; font-weight: 200;
      color: rgba(255,255,255,.92); letter-spacing: .06em;
      text-align: center;
      margin-bottom: 4px;
    }
    #time-label {
      font-size: .72rem; letter-spacing: .1em; text-transform: uppercase;
      color: rgba(255,255,255,.32); text-align: center;
      margin-bottom: 16px;
    }

    #sms-row {
      display: flex; align-items: center; justify-content: center; gap: 7px;
      font-size: .78rem; color: rgba(255,255,255,.38);
    }
    #sms-icon { font-size: .9rem; }

    /* ── Error / unknown card ───────────────────────────────────────────── */
    #error-screen {
      display: none;
      flex-direction: column; align-items: center; gap: 16px;
      animation: fadeIn .3s ease;
    }
    @keyframes fadeIn { from { opacity:0 } to { opacity:1 } }
    #error-icon { font-size: 4rem; }
    #error-msg  { font-size: 1.3rem; font-weight: 600; color: var(--red); text-align: center; }
    #error-sub  { font-size: .9rem; color: rgba(255,255,255,.35); text-align: center; }

    /* ── Countdown bar ──────────────────────────────────────────────────── */
    /* Sits just above the case's bottom bezel on a 7" screen. */
    #countdown-bar {
      position: fixed; bottom: 14px; left: 0; right: 0; height: 4px;
      bottom: max(14px, env(safe-area-inset-bottom, 14px));
      background: rgba(255,255,255,.08); display: none;
    }
    #countdown-fill {
      height: 100%; background: rgba(255,255,255,.3);
      transition: width linear;
    }

    /* ── Hidden RFID input ──────────────────────────────────────────────── */
    #rfid-input {
      position: fixed; top: -9999px; left: -9999px;
      opacity: 0; width: 1px; height: 1px;
    }

    /* ── 7-inch screen optimisation (800×480 / 1024×600 / 1024×768→600 scaled) ─ */
    /* Uses 700px so it also catches Pi 7" displays where Chromium reports
       768px viewport but the panel physically scales to 600px (causing the
       visual "squish"). Compresses everything so the whole UI fits in ~520px
       of usable height after the case bezel takes its 60-100px bite. */
    @media (max-height: 700px) {
      #header { padding-top: 70px; padding-bottom: 10px; }
      #stage { padding-top: 128px; padding-bottom: 16px; }
      .logo-circle, .logo-circle-wrapper { width: 150px; height: 150px; }
      .logo-circle { box-shadow: 0 0 40px rgba(41,121,255,.18); }
      #idle { gap: 14px; }
      #idle-school { font-size: 1rem; }
      #idle-text { font-size: .95rem; margin-top: -6px; }
      #idle-sub { font-size: .7rem; margin-top: -8px; }

      #result { width: min(370px, 92vw); border-radius: 20px; }
      #result-body { padding: 16px 22px 14px; }
      #student-photo, #student-initials {
        width: 120px; height: 120px;
        border-radius: 12px; font-size: 2.6rem;
        margin-bottom: 10px;
      }
      #student-name { font-size: 1.25rem; margin-bottom: 4px; }
      #student-grade-badge { margin-bottom: 12px; padding: 3px 11px; font-size: .72rem; }
      .card-divider { margin-bottom: 10px; }
      #action-row { margin-bottom: 8px; gap: 8px; }
      #action-badge { font-size: .76rem; padding: 5px 14px; }
      #status-badge { font-size: .72rem; padding: 4px 11px; }
      #time-display { font-size: 2rem; margin-bottom: 2px; }
      #time-label { margin-bottom: 8px; font-size: .68rem; }
      #sms-row { font-size: .72rem; }
    }

    /* Narrower than typical desktop — tighten header so clock fits cleanly. */
    @media (max-width: 820px) {
      #header { padding-left: 18px; padding-right: 18px; }
      #scanner-label { font-size: .72rem; padding: 5px 12px; letter-spacing: .12em; }
      #clock-date { font-size: .72rem; }
      #clock-time { font-size: 1.2rem; }
    }

    /* ── Connection badge (bottom-right) ────────────────────────────────── */
    /* Push it above the case's bottom bezel so the dot/text stays visible. */
    #conn-badge {
      position: fixed; bottom: 28px; right: 18px;
      bottom: max(28px, calc(env(safe-area-inset-bottom, 0px) + 22px));
      right:  max(18px, env(safe-area-inset-right, 18px));
      display: flex; align-items: center; gap: 8px;
      padding: 7px 14px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 20px;
      font-size: .78rem; font-weight: 600;
      color: rgba(255,255,255,.55);
      backdrop-filter: blur(8px);
      z-index: 20;
      transition: color .25s, border-color .25s, background .25s;
    }
    #conn-badge .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #9aa0a6;
    }
    #conn-badge.connected { color: #fff; border-color: rgba(0,200,83,.4); }
    #conn-badge.connected .dot {
      background: var(--green);
      animation: conn-pulse 2s ease-out infinite;
    }
    #conn-badge.disconnected {
      color: #ffcdd2;
      border-color: rgba(255,23,68,.45);
      background: rgba(255,23,68,.12);
    }
    #conn-badge.disconnected .dot { background: var(--red); }
    @keyframes conn-pulse {
      0%   { box-shadow: 0 0 0 0 rgba(0,200,83,.55); }
      100% { box-shadow: 0 0 0 8px rgba(0,200,83,0); }
    }
  </style>
</head>
<body>

<!-- Header -->
<div id="header">
  <div id="header-left">
    <div id="scanner-label">Scanner —</div>
  </div>
  <div id="header-right">
    <div id="clock-date"></div>
    <div id="clock-time"></div>
  </div>
</div>

<!-- Stage -->
<div id="stage">

  <!-- Idle -->
  <div id="idle">
    <div class="logo-circle-wrapper">
      <div class="logo-wave"></div>
      <div class="logo-wave"></div>
      <div class="logo-wave"></div>
      <div class="logo-circle">
        <img src="/static/logo.png" alt="School Logo" />
      </div>
    </div>
    <div id="idle-school"></div>
    <div id="idle-text">Scan Your ID Card</div>
    <div id="idle-sub">Place your RFID card near the reader</div>
  </div>

  <!-- Scan result -->
  <div id="result">
    <div id="result-accent"></div>
    <div id="result-body">
      <img id="student-photo" src="" alt="" />
      <div id="student-initials"></div>
      <div id="student-name"></div>
      <div id="student-grade-badge"></div>
      <div class="card-divider"></div>
      <div id="action-row">
        <div id="action-badge"></div>
        <div id="status-badge"></div>
      </div>
      <div id="time-display"></div>
      <div id="time-label"></div>
      <div id="sms-row">
        <span id="sms-icon">📱</span>
        <span id="sms-text"></span>
      </div>
    </div>
  </div>

  <!-- Error -->
  <div id="error-screen">
    <div id="error-icon">⚠️</div>
    <div id="error-msg"></div>
    <div id="error-sub">Please see the teacher or administrator.</div>
  </div>

</div>

<!-- Countdown bar -->
<div id="countdown-bar"><div id="countdown-fill" style="width:100%"></div></div>

<!-- Hidden RFID input — always focused -->
<input id="rfid-input" type="text" autocomplete="off" />

<!-- Connection badge -->
<div id="conn-badge" title="Server connection">
  <span class="dot"></span>
  <span id="conn-text">Connecting…</span>
</div>

<script>
// ── URL params ────────────────────────────────────────────────────────────────
const params    = new URLSearchParams(window.location.search);
const SCANNER_ID    = params.get('id')     || '1';
const SCANNER_LABEL = params.get('label')  || `Scanner ${SCANNER_ID}`;
const USE_PREFIX    = params.get('prefix') !== 'false';  // default on
const MY_PREFIX     = `!${SCANNER_ID}!`;                 // e.g. "!1!" or "!2!"
const RESET_DELAY   = parseInt(params.get('delay') || '5') * 1000;
const API = '';

// ── DOM refs ──────────────────────────────────────────────────────────────────
const $idle       = document.getElementById('idle');
const $result     = document.getElementById('result');
const $error      = document.getElementById('error-screen');
const $rfid       = document.getElementById('rfid-input');
const $cntBar     = document.getElementById('countdown-bar');
const $cntFill    = document.getElementById('countdown-fill');

// ── Init header ───────────────────────────────────────────────────────────────
document.getElementById('scanner-label').textContent = SCANNER_LABEL;
document.title = SCANNER_LABEL;

// Load school name into the idle splash (header no longer has it).
fetch(`${API}/status`).then(r => r.json()).then(s => {
  const idleSchool = document.getElementById('idle-school');
  if (idleSchool) idleSchool.textContent = s.school;
}).catch(() => {});

// ── Server connection badge ───────────────────────────────────────────────────
const $connBadge = document.getElementById('conn-badge');
const $connText  = document.getElementById('conn-text');
let lastConnState = null;
async function pollServerConn() {
  let ok = false;
  try {
    const ctrl = new AbortController();
    const t   = setTimeout(() => ctrl.abort(), 3000);
    const r   = await fetch(`${API}/ping`, { cache: 'no-store', signal: ctrl.signal });
    clearTimeout(t);
    ok = r.ok;
  } catch { ok = false; }
  if (ok === lastConnState) return;
  lastConnState = ok;
  $connBadge.classList.toggle('connected', ok);
  $connBadge.classList.toggle('disconnected', !ok);
  $connText.textContent = ok ? 'Connected' : 'Disconnected';
}
setInterval(pollServerConn, 5000); pollServerConn();

// ── Heartbeat (lets the dashboard show this scanner as online) ────────────────
async function sendHeartbeat() {
  try {
    await fetch(`${API}/scanner-heartbeat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ scanner_id: SCANNER_ID, label: SCANNER_LABEL }),
      cache: 'no-store',
    });
  } catch (_) { /* ignore network blips */ }
}
setInterval(sendHeartbeat, 30000); sendHeartbeat();

// ── Clock ─────────────────────────────────────────────────────────────────────
function updateClock() {
  const now = new Date();
  document.getElementById('clock-date').textContent =
    now.toLocaleDateString('en-PH', {weekday:'short', month:'short', day:'numeric', year:'numeric'});
  document.getElementById('clock-time').textContent =
    now.toLocaleTimeString('en-PH', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
}
setInterval(updateClock, 1000); updateClock();

// ── RFID input handling ───────────────────────────────────────────────────────
// Always keep the hidden input focused (but not when user is typing elsewhere)
document.addEventListener('click', () => $rfid.focus());
document.addEventListener('keydown', () => $rfid.focus());
$rfid.focus();

let resetTimer = null;
let scanBufferTimer = null;
const SCAN_BUFFER_DELAY_MS = 220;
const MIN_UID_LENGTH = 4;
const UID_DEDUPE_WINDOW_MS = 1200;
let isSubmittingScan = false;
let lastSubmittedUid = '';
let lastSubmittedAt = 0;
let pendingUid = '';

function processUid(rawUid) {
  let uid = (rawUid || '').trim();
  if (!uid) return;

  // If prefix mode is ON and UID starts with another scanner's prefix -> ignore
  // If UID starts with MY prefix -> strip it and process
  // If UID has no prefix -> process anyway (single-scanner fallback)
  if (USE_PREFIX) {
    if (uid.startsWith(MY_PREFIX)) {
      uid = uid.slice(MY_PREFIX.length);
    } else if (/^!\d+!/.test(uid)) {
      return;
    }
  }

  uid = uid.trim();
  if (uid.length < MIN_UID_LENGTH) return;
  submitScan(uid);
}

$rfid.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const uid = $rfid.value;
    $rfid.value = '';
    if (scanBufferTimer) {
      clearTimeout(scanBufferTimer);
      scanBufferTimer = null;
    }
    processUid(uid);
    return;
  }
});

// Fallback path for readers that don't send Enter:
// run after input value stops changing briefly.
$rfid.addEventListener('input', () => {
  if (scanBufferTimer) clearTimeout(scanBufferTimer);
  scanBufferTimer = setTimeout(() => {
    const uid = $rfid.value;
    $rfid.value = '';
    processUid(uid);
  }, SCAN_BUFFER_DELAY_MS);
});

// ── Submit scan ───────────────────────────────────────────────────────────────
async function submitScan(uid) {
  uid = (uid || '').trim().toUpperCase();
  if (!uid) return;

  const now = Date.now();
  if (isSubmittingScan) {
    pendingUid = uid;
    return;
  }
  if (uid === lastSubmittedUid && (now - lastSubmittedAt) < UID_DEDUPE_WINDOW_MS) return;

  isSubmittingScan = true;
  lastSubmittedUid = uid;
  lastSubmittedAt = now;

  if (resetTimer) {
    clearTimeout(resetTimer);
    resetTimer = null;
  }

  try {
    const data = await fetch(`${API}/scan`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rfid_uid: uid, scanner_id: SCANNER_ID }),
    }).then(r => r.json());

    if (data.success && data.student) {
      showStudent(data);
    } else {
      showError(data.message || 'Unknown error');
    }
  } catch(e) {
    showError('Cannot reach server. Check connection.');
  } finally {
    isSubmittingScan = false;
    if (pendingUid) {
      const nextUid = pendingUid;
      pendingUid = '';
      submitScan(nextUid);
    }
  }
  $rfid.focus();
}

// ── Show student/teacher result ───────────────────────────────────────────────
function showStudent(data) {
  // Unified renderer for both students and teachers. /scan returns either
  // {kind:"student", student, attendance} or {kind:"teacher", teacher, teacher_attendance}.
  const isTeacher = data.kind === 'teacher';
  const s   = isTeacher ? data.teacher : data.student;
  const att = isTeacher ? data.teacher_attendance : data.attendance;
  const action = data.action;

  // Photo or initials
  const photoEl    = document.getElementById('student-photo');
  const initialsEl = document.getElementById('student-initials');
  if (s.photo_path) {
    photoEl.src = s.photo_path;
    photoEl.style.display = 'block';
    initialsEl.style.display = 'none';
    photoEl.onerror = () => {
      photoEl.style.display = 'none';
      initialsEl.style.display = 'flex';
    };
  } else {
    photoEl.style.display = 'none';
    initialsEl.style.display = 'flex';
    initialsEl.textContent = s.full_name.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();
  }

  // Sub-badge: grade/section for students, role (FACULTY / STAFF) for faculty & staff
  const badge = document.getElementById('student-grade-badge');
  if (isTeacher) {
    badge.textContent = (s.role || 'FACULTY').toUpperCase();
  } else {
    const gradeSec = [s.grade, s.section].filter(Boolean).join(' — ');
    badge.textContent = gradeSec || 'No section';
  }

  // Name
  document.getElementById('student-name').textContent = s.full_name;

  // Action badge
  const actionBadge = document.getElementById('action-badge');
  const actionMap = {
    am_in:    { text: 'MORNING IN',      cls: 'time-in'  },
    am_out:   { text: 'MORNING OUT',     cls: 'time-out' },
    pm_in:    { text: 'AFTERNOON IN',    cls: 'time-in'  },
    pm_out:   { text: 'AFTERNOON OUT',   cls: 'time-out' },
    complete: { text: 'ALREADY COMPLETE',cls: 'time-out' },
  };
  const actionInfo = actionMap[action] || { text: action?.toUpperCase(), cls: 'time-in' };
  actionBadge.textContent = actionInfo.text;
  actionBadge.className   = actionInfo.cls;

  // Status badge
  const statusBadge = document.getElementById('status-badge');
  const status = att?.status || 'present';
  const statusMap = { present: 'PRESENT', late: 'LATE ⚠', absent: 'ABSENT', excused: 'EXCUSED' };
  statusBadge.textContent = statusMap[status] || status.toUpperCase();
  statusBadge.className = status === 'late' ? 'late' : (action?.includes('out') ? 'timeout' : 'present');

  // Accent bar colour
  const accent = document.getElementById('result-accent');
  accent.className = status === 'late' ? 'late' : (action?.includes('out') ? 'timeout' : '');

  // Time — pick the relevant time field based on action
  const timeFields = { am_in: 'am_time_in', am_out: 'am_time_out', pm_in: 'pm_time_in', pm_out: 'pm_time_out' };
  const timeVal = att?.[timeFields[action]];
  document.getElementById('time-display').textContent = timeVal
    ? formatTime(timeVal) : new Date().toLocaleTimeString('en-PH', {hour:'2-digit', minute:'2-digit'});
  const timeLabels = { am_in: 'MORNING ARRIVAL', am_out: 'MORNING DISMISSAL', pm_in: 'AFTERNOON ARRIVAL', pm_out: 'AFTERNOON DISMISSAL' };
  document.getElementById('time-label').textContent = timeLabels[action] || 'RECORDED';

  // SMS row — teacher scans now do send SMS (to configured admin recipients),
  // so we show the same icon/text for both kinds.
  document.getElementById('sms-icon').textContent = data.sms_sent ? '📱' : '📵';
  document.getElementById('sms-text').textContent = data.sms_sent
    ? 'SMS queued/sent'
    : 'SMS not sent';

  showScreen('result');
  scheduleReset();
}

// ── Show error ─────────────────────────────────────────────────────────────────
function showError(msg) {
  document.getElementById('error-msg').textContent = msg;
  showScreen('error');
  scheduleReset(3000);
}

// ── Screen transitions ─────────────────────────────────────────────────────────
function showScreen(which) {
  $idle.style.display   = 'none';
  $result.style.display = 'none';
  $error.style.display  = 'none';

  if (which === 'idle')   { $idle.style.display = 'flex'; }
  if (which === 'result') { $result.style.display = 'block'; }
  if (which === 'error')  { $error.style.display = 'flex'; }
}

function scheduleReset(delay = RESET_DELAY) {
  if (resetTimer) {
    clearTimeout(resetTimer);
    resetTimer = null;
  }

  // Countdown bar
  $cntBar.style.display = 'block';
  $cntFill.style.transition = 'none';
  $cntFill.style.width = '100%';
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      $cntFill.style.transition = `width ${delay}ms linear`;
      $cntFill.style.width = '0%';
    });
  });

  resetTimer = setTimeout(() => {
    showScreen('idle');
    $cntBar.style.display = 'none';
  }, delay);
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function formatTime(t) {
  // t is "HH:MM:SS" from API
  const [h, m] = t.split(':');
  const hour = parseInt(h);
  const ampm = hour >= 12 ? 'PM' : 'AM';
  const h12 = hour % 12 || 12;
  return `${h12}:${m} ${ampm}`;
}

// ── Start on idle ─────────────────────────────────────────────────────────────
showScreen('idle');
$rfid.focus();
</script>
